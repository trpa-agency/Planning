# Zoning edits and QA. Paths, dataset names, and run flags. No credentials here:
# the .sde connection file holds them.

project:
  name: trpa-zoning-edits
  owner: Mason Bindl

sde:
  # .sde connection file on the server. Use forward slashes, or single quotes with
  # backslashes; double quotes treat backslashes as escapes.
  # For writes, this connection must point at the QA edit version. The snapshot logs
  # the connected version, so run it first to see the name.
  # Vector.sde points at DEFAULT. This copy points at the mtb-edits version.
  connection: "F:/GIS/DB_CONNECT/Vector_mtb-edits.sde"
  # Owner SDE, Protected, child of Alyssa's "Misc edits Nov 2026" (created 2026-11-23).
  edit_version: "SDE.mtb-edits"
  # Writes are refused when the connection points at any of these. A name without an
  # owner prefix matches that version under any owner.
  protected_versions:
    - "DEFAULT"
    - "Misc edits Nov 2026"

# Dataset paths relative to the connection, with a feature dataset prefix where there
# is one. If a prefixed path does not exist, the scripts look for the name at the
# geodatabase root (standalone tables cannot live in a feature dataset).
datasets:
  district: SDE.Planning/SDE.District
  permissible_uses: SDE.PermissibleUses          # confirmed at root 2026-11-23
  special_designation: SDE.Special_Designation   # confirmed at root 2026-11-23
  parcel: SDE.Parcels/SDE.Parcel_Master
  local_plan_parcels: null           # Local Plan parcel feature class; fill in once known
  cnel: SDE.District_CNEL            # new table; created by cnel_build_table.py

# Key field name per dataset. Permissible Use spells it differently.
keys:
  district: ZONING_ID
  permissible_uses: Zoning_ID
  special_designation: ZONING_ID
  parcel: ZONING_ID
  local_plan_parcels: ZONING_ID
  cnel: ZONING_ID

paths:
  snapshots: data/snapshots
  outputs: outputs
  logs: logs
  fix_package_csv: fix_package/csv

run:
  write_to_db: false   # set to true only for the run that should edit the version

snapshot:
  # District ZONING_IDs to report in detail (SQL LIKE patterns).
  watch_zoning_ids: ["%055%", "%056%", "035%", "032B", "045%"]

e03:
  # Delete the duplicate Crystal Bay Condominiums shape and keep the use table.
  zoning_id: "035"
  delete_objectid: 842
  keep_objectid: 405
  # Abort if the duplicate covers more than this many acres outside the kept shape.
  max_extra_acres: 0.01
  # Copying 405 to make 842 also copied its 28 use rows (all keyed 035, created
  # 2026-11-20 23:51:47). Delete the copies and keep the originals: within each set of
  # rows with identical content, the lowest OBJECTID is kept. The script stops if the
  # number of copies differs from this count.
  dedupe_tables: [permissible_uses]
  dedupe_fields:
    permissible_uses: [Category, Subcategory, Use_Type, Use_Status, Density, Unit, Notes]
  expected_duplicates:
    permissible_uses: 28

rebuild:
  # Insert rows to move to a new ZONING_ID before checking, by fix ID.
  # Alyssa split 055 and 056; the Washoe code tables (A04) belong to the Washoe halves.
  rekey:
    A04: {"055": "WCTAP_055", "056": "WCTAP_056"}
  # Copied through unchanged; these are decisions, not edits.
  passthrough: [pending_rulings.csv, area_pending_rulings.csv, pending_split_parcels.csv]
  # Fix IDs left out of the rebuilt package, with the reason (status "dropped").
  drop:
    F30: "Parcel ETL sets Parcel_Master zoning fields from District (Mason, 2026-11-23)"
    F31: "Parcel ETL sets Parcel_Master zoning fields from District (Mason, 2026-11-23)"
    F32: "Parcel ETL sets Parcel_Master zoning fields from District (Mason, 2026-11-23)"
    F33: "Parcel ETL sets Parcel_Master zoning fields from District (Mason, 2026-11-23)"
    F25: "Esri Check Geometry finds no problem; the shapes fail only OGC rules (self-touching rings, allowed in ArcGIS). Checked 2026-11-24"

post_tables:
  # Optional fixed targets, checked on top of the counts computed from a package.
  # A package's own package.yaml overrides these. Set per run; the 2026-11-23 fix
  # package posted at 10,971 and 484.
  expected_counts:
    permissible_uses: null
    special_designation: null

geometry:
  # F26 to F28: clip each overlap off the district that loses it. Expected overlap
  # areas are from the 2026-11-20 QA pass. 030 and 040 are WCTAP_030 and WCTAP_040 after E04.
  clips:
    - {fix: F26, lose: 111_SA2, keep: TVAP_TC_NP, expect_acres: 6.439}
    - {fix: F27, lose: WCTAP_030, keep: WCTAP_040, expect_acres: 0.521}
    - {fix: F28, lose: "114", keep: 114_SA1, expect_acres: 0.012}
  # F29: fill the coverage hole under this parcel into the named district.
  fill: {fix: F29, apn: 032-141-018, district: TVAP_TC_G, expect_acres: 1.045}
  # A computed area may differ from the expected one by this much before the script stops.
  tolerance_acres: 0.05
  # Polygon parts smaller than this are dropped from a clipped shape (slivers).
  min_part_sq_m: 1.0
  # F34: recalculate ACRES (planar, EPSG 26910) after the shape edits, on every district
  # whose stored value is off by more than acres_threshold. Smaller differences are rounding.
  recalc_acres: true
  acres_threshold: 0.001

f36:
  # Delete use rows where every field below is blank. In mtb-edits that is 58 rows added
  # on 2026-11-20 plus OBJECTID 12762 from DEFAULT (fix F22), 59 in all.
  table: permissible_uses
  fields: [Zoning_ID, Category, Subcategory, Use_Type, Use_Status, Density, Unit, Notes]
  expected_count: 59

e04:
  # Prefix Washoe County district IDs with WCTAP_ (Alyssa's request; Mason confirmed the
  # format and that 019 is included, 2026-11-23).
  prefix: "WCTAP_"
  plan_id: WCTAP              # districts with this PLAN_ID are renamed...
  exclude: ["055", "056"]     # ...except the Carson City halves, which keep their IDs
  expected_count: 36          # 38 WCTAP districts on 2026-11-20, less 055 and 056
  # Further datasets keyed on ZONING_ID to rename in the same session (keys from
  # `datasets`). Parcel_Master is left to the parcel ETL. Add local_plan_parcels here
  # only if the ETL does not maintain it.
  also_update: []

f35:
  # Restore ZONING_ID on Special Designation rows orphaned by a TVAP_TC_NP shape edit.
  # Found in the DEFAULT snapshot of 2026-11-23; see docs/EDIT_REQUESTS.md.
  table: special_designation
  zoning_id: TVAP_TC_NP
  zoning_description: "Tahoe Valley Area Plan - Town Center Neighborhood Professional"
  rows:
    - {objectid: 145, globalid: "{BEE7739F-C287-42CB-9915-6A06B4E8C029}"}
    - {objectid: 164, globalid: "{F0ED7835-9BB0-4646-AF0F-D3BC30EAD9C2}"}
    - {objectid: 207, globalid: "{C173A649-23D3-4B22-9F36-C771EB51207B}"}

cnel:
  # District CNEL table (replaces AGIS_TRPA/MapServer/82). One row per District ZONING_ID,
  # keyed on post-E04 IDs (WCTAP_ prefix, 055 and 056 Carson City halves). Sources, page
  # citations, and open decisions (N01 to N08) are in the CSV; see docs/CNEL.md.
  csv: data/reference/cnel_by_district.csv
  # Create SDE.District_CNEL on the first write run if it does not exist.
  create_table: false
  # Every CNEL in the table must be one of these.
  valid_values: [25, 40, 45, 50, 55, 60, 65]
  # cnel_export_gpkg.py: output GeoPackage (committed) and its source layers.
  gpkg: data/cnel/district_cnel.gpkg
  district_url: https://maps.trpa.org/server/rest/services/Zoning/MapServer/0
  legacy_url: https://maps.trpa.org/server/rest/services/AGIS_TRPA/MapServer/82

corridor:
  # Highway noise corridors for cnel_export_gpkg.py. Major Highways is the centerline base;
  # Streets supplies route names and fills gaps. Routes are keyed as in src/cnel.py.
  major_url: https://maps.trpa.org/server/rest/services/AGIS_TRPA/MapServer/10
  streets_url: https://maps.trpa.org/server/rest/services/DataDownloader_Transportation/MapServer/2
  # Feet each side of the centerline. Meyers, Tahoe Valley, and Tourist Core state 300 feet;
  # the Plan Area Statements and the other plans give no width.
  buffer_feet: 300
  # Streets names that are a state route. "NAME|Nv" matches only that maintenance code.
  streets_names:
    US 50: [US ROUTE 50, US HWY 50, US 50]
    SR 28: [STATE ROUTE 28, SR 28, US HWY 28, STATE HWY 28, "TAHOE BLVD|Nv", "NORTHLAKE BLVD|Nv"]
    SR 89: [STATE ROUTE 89, SR 89]
    SR 207: [STATE ROUTE 207, SR 207, "KINGSBURY GRADE|Nv"]
    SR 267: [STATE ROUTE 267, SR 267]
    SR 431: [STATE ROUTE 431, SR 431]
  # Major Highways names, used where Streets does not name a segment.
  major_names:
    US 50: [US ROUTE 50]
    SR 28: [STATE ROUTE 28]
    SR 89: [STATE ROUTE 89]
    SR 207: [KINGSBURY GRADE]
    SR 267: [STATE ROUTE 267]
    SR 431: [STATE ROUTE 431]
  match_m: 20          # Streets segments this close to a Major Highways segment name it
  match_share: 0.5     # ...when they overlap at least this share of its length
  fill_gap_m: 30       # Streets route segments farther than this from Major Highways fill gaps
  fill_min_m: 100      # ...in pieces at least this long
  min_piece_acres: 0.01
