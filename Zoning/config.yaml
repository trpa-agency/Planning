# Zoning edits and QA. Paths, dataset names, and run flags. No credentials here:
# the .sde connection file holds them.

project:
  name: trpa-zoning-edits
  owner: Mason Bindl

sde:
  # .sde connection file on the server. Use forward slashes, or single quotes with
  # backslashes; double quotes treat backslashes as escapes.
  # For writes, this connection must point at the QA edit version. The snapshot logs
  # the connected version, so run it first to see the name.
  connection: "F:/GIS/DB_CONNECT/Vector.sde"
  # Full version name as shown in the Versions view, owner prefix included.
  edit_version: "OWNER.Zoning_QA_Edits"
  # Writes are refused when the connection points at any of these. A name without an
  # owner prefix matches that version under any owner.
  protected_versions:
    - "DEFAULT"
    - "Misc edits Nov 2026"

# Dataset paths relative to the connection, with a feature dataset prefix where there
# is one. If a prefixed path does not exist, the scripts look for the name at the
# geodatabase root (standalone tables cannot live in a feature dataset).
datasets:
  district: SDE.Planning/SDE.District
  permissible_uses: SDE.PermissibleUses          # confirmed at root 2026-11-23
  special_designation: SDE.Special_Designation   # confirmed at root 2026-11-23
  parcel: SDE.Parcels/SDE.Parcel_Master
  local_plan_parcels: null           # Local Plan parcel feature class; fill in once known

# Key field name per dataset. Permissible Use spells it differently.
keys:
  district: ZONING_ID
  permissible_uses: Zoning_ID
  special_designation: ZONING_ID
  parcel: ZONING_ID
  local_plan_parcels: ZONING_ID

paths:
  snapshots: data/snapshots
  outputs: outputs
  logs: logs
  fix_package_csv: fix_package/csv

run:
  write_to_db: false   # set to true only for the run that should edit the version

snapshot:
  # District ZONING_IDs to report in detail (SQL LIKE patterns).
  watch_zoning_ids: ["%055%", "%056%", "035%", "032B", "045%"]

e03:
  # Delete the duplicate Crystal Bay Condominiums shape and keep the use table.
  zoning_id: "035"
  delete_objectid: 842
  keep_objectid: 405
  # Abort if the duplicate covers more than this many acres outside the kept shape.
  max_extra_acres: 0.01
