# Zoning edits and QA. Paths, dataset names, and run flags. No credentials here:
# the .sde connection file holds them.

project:
  name: trpa-zoning-edits
  owner: Mason Bindl

sde:
  # .sde connection file on the server. Use forward slashes, or single quotes with
  # backslashes; double quotes treat backslashes as escapes.
  # For writes, this connection must point at the QA edit version. The snapshot logs
  # the connected version, so run it first to see the name.
  # Vector.sde points at DEFAULT. This copy points at the mtb-edits version.
  connection: "F:/GIS/DB_CONNECT/Vector_mtb-edits.sde"
  # Owner SDE, Protected, child of Alyssa's "Misc edits Nov 2026" (created 2026-11-23).
  edit_version: "SDE.mtb-edits"
  # Writes are refused when the connection points at any of these. A name without an
  # owner prefix matches that version under any owner.
  protected_versions:
    - "DEFAULT"
    - "Misc edits Nov 2026"

# Dataset paths relative to the connection, with a feature dataset prefix where there
# is one. If a prefixed path does not exist, the scripts look for the name at the
# geodatabase root (standalone tables cannot live in a feature dataset).
datasets:
  district: SDE.Planning/SDE.District
  permissible_uses: SDE.PermissibleUses          # confirmed at root 2026-11-23
  special_designation: SDE.Special_Designation   # confirmed at root 2026-11-23
  parcel: SDE.Parcels/SDE.Parcel_Master
  local_plan_parcels: null           # Local Plan parcel feature class; fill in once known

# Key field name per dataset. Permissible Use spells it differently.
keys:
  district: ZONING_ID
  permissible_uses: Zoning_ID
  special_designation: ZONING_ID
  parcel: ZONING_ID
  local_plan_parcels: ZONING_ID

paths:
  snapshots: data/snapshots
  outputs: outputs
  logs: logs
  fix_package_csv: fix_package/csv

run:
  write_to_db: false   # set to true only for the run that should edit the version

snapshot:
  # District ZONING_IDs to report in detail (SQL LIKE patterns).
  watch_zoning_ids: ["%055%", "%056%", "035%", "032B", "045%"]

e03:
  # Delete the duplicate Crystal Bay Condominiums shape and keep the use table.
  zoning_id: "035"
  delete_objectid: 842
  keep_objectid: 405
  # Abort if the duplicate covers more than this many acres outside the kept shape.
  max_extra_acres: 0.01
  # Copying 405 to make 842 also copied its 28 use rows (all keyed 035, created
  # 2026-11-20 23:51:47). Delete the copies and keep the originals: within each set of
  # rows with identical content, the lowest OBJECTID is kept. The script stops if the
  # number of copies differs from this count.
  dedupe_tables: [permissible_uses]
  dedupe_fields:
    permissible_uses: [Category, Subcategory, Use_Type, Use_Status, Density, Unit, Notes]
  expected_duplicates:
    permissible_uses: 28

rebuild:
  # Insert rows to move to a new ZONING_ID before checking, by fix ID.
  # Alyssa split 055 and 056; the Washoe code tables (A04) belong to the Washoe halves.
  rekey:
    A04: {"055": "WCTAP_055", "056": "WCTAP_056"}
  # Copied through unchanged; these are decisions, not edits.
  passthrough: [pending_rulings.csv, area_pending_rulings.csv, pending_split_parcels.csv]
  # Fix IDs left out of the rebuilt package, with the reason (status "dropped").
  drop:
    F30: "Parcel ETL sets Parcel_Master zoning fields from District (Mason, 2026-11-23)"
    F31: "Parcel ETL sets Parcel_Master zoning fields from District (Mason, 2026-11-23)"
    F32: "Parcel ETL sets Parcel_Master zoning fields from District (Mason, 2026-11-23)"
    F33: "Parcel ETL sets Parcel_Master zoning fields from District (Mason, 2026-11-23)"

post_tables:
  # Optional fixed targets, checked on top of the counts computed from a package.
  # A package's own package.yaml overrides these. Set per run; the 2026-11-23 fix
  # package posted at 10,971 and 484.
  expected_counts:
    permissible_uses: null
    special_designation: null

f36:
  # Delete use rows where every field below is blank. In mtb-edits that is 58 rows added
  # on 2026-11-20 plus OBJECTID 12762 from DEFAULT (fix F22), 59 in all.
  table: permissible_uses
  fields: [Zoning_ID, Category, Subcategory, Use_Type, Use_Status, Density, Unit, Notes]
  expected_count: 59

f35:
  # Restore ZONING_ID on Special Designation rows orphaned by a TVAP_TC_NP shape edit.
  # Found in the DEFAULT snapshot of 2026-11-23; see docs/EDIT_REQUESTS.md.
  table: special_designation
  zoning_id: TVAP_TC_NP
  zoning_description: "Tahoe Valley Area Plan - Town Center Neighborhood Professional"
  rows:
    - {objectid: 145, globalid: "{BEE7739F-C287-42CB-9915-6A06B4E8C029}"}
    - {objectid: 164, globalid: "{F0ED7835-9BB0-4646-AF0F-D3BC30EAD9C2}"}
    - {objectid: 207, globalid: "{C173A649-23D3-4B22-9F36-C771EB51207B}"}
