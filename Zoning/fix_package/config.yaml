# Reference copy from the 2026-11-20 fix package. The scripts in Zoning/scripts read
# Zoning/config.yaml, not this file.
project:
  name: zoning-qa-fixes
  owner: mbindl@trpa.gov
  built: 2026-11-20

# SDE targets on the server. No credentials go here; the .sde connection file holds them.
# Forward slashes: inside double quotes, YAML reads backslashes as escape characters.
sde:
  workspace: "F:/GIS/DB_CONNECT/Vector.sde"
  district: "F:/GIS/DB_CONNECT/Vector.sde/SDE.Planning/SDE.District"
  permissible_uses: "F:/GIS/DB_CONNECT/Vector.sde/SDE.Planning/SDE.PermissibleUses"
  special_designation: "F:/GIS/DB_CONNECT/Vector.sde/SDE.Planning/SDE.Special_Designation"
  parcel: "F:/GIS/DB_CONNECT/Vector.sde/SDE.Parcels/SDE.Parcel_Master"

fixes:
  gdb: data/Zoning_QA_Fixes_2026-11-20.gdb
  replacement_shapes: F26_F29_District_ReplacementShapes

# Live sources the fixes were built from (snapshot taken 2026-11-20)
sources:
  zoning_service: https://maps.trpa.org/server/rest/services/Zoning/MapServer
  localplan_service: https://maps.trpa.org/server/rest/services/LocalPlan/MapServer
  boundaries_service: https://maps.trpa.org/server/rest/services/Boundaries/MapServer

run:
  dry_run: true   # set to false to let scripts write to SDE
